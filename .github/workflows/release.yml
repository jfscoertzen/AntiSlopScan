name: Alpha release
on:
  push:
    tags: ['v*-alpha.*']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    with:
      release: true
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - name: Verify release version
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: artifacts/ci
      - name: Load the tested image and verify asset checksums
        run: |
          gzip -dc artifacts/ci/verified-image.tar.gz | docker load
          cd artifacts/ci/release
          sha256sum --check SHA256SUMS
      - name: Authenticate to Docker Hub
        env:
          DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        run: printf '%s' "$DOCKER_TOKEN" | docker login --username jfscoertzen --password-stdin
      - name: Publish versioned and alpha images
        shell: bash
        run: |
          set -euo pipefail
          version=${GITHUB_REF_NAME#v}
          docker tag antislopscan:ci "jfscoertzen/antislopscan:$version"
          docker tag antislopscan:ci jfscoertzen/antislopscan:alpha
          docker push "jfscoertzen/antislopscan:$version"
          docker push jfscoertzen/antislopscan:alpha
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/ci/release/* --prerelease --title "AntiSlopScan ${GITHUB_REF_NAME}" --notes-file docs/RELEASE_NOTES.md
      - name: Clear registry credentials
        if: always()
        run: docker logout
