name: antislopscan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and verify the complete appliance
        run: docker build --platform linux/amd64 -t antislopscan:ci .
      - name: Scan Git history for secrets
        run: |
          packageContainer=$(docker create antislopscan:ci)
          trap 'docker rm "$packageContainer" >/dev/null' EXIT
          docker cp "$packageContainer:/app/tools/bin/gitleaks" "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" git "$PWD" --log-opts=--all --no-banner --redact
      - name: Run appliance documentation checks
        run: docker run --rm --network none --entrypoint npm antislopscan:ci run check:docs
      - name: Extract the verified npm package
        run: |
          mkdir -p "$RUNNER_TEMP/antislopscan-npm"
          packageContainer=$(docker create antislopscan:ci)
          trap 'docker rm "$packageContainer" >/dev/null' EXIT
          docker cp "$packageContainer:/app/artifacts/." "$RUNNER_TEMP/antislopscan-npm/"
      - name: Self-audit with no network and read-only source
        run: |
          mkdir -p "$RUNNER_TEMP/antislopscan-reports"
          sudo chown 1000:1000 "$RUNNER_TEMP/antislopscan-reports"
          sudo chmod 700 "$RUNNER_TEMP/antislopscan-reports"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 256 --memory 4g \
            --tmpfs /tmp:size=1073741824,mode=1777 \
            -v "$PWD:/workspace:ro" -v "$RUNNER_TEMP/antislopscan-reports:/reports" \
            antislopscan:ci cli --source /workspace \
            --config /app/config/self-audit.json --output /reports
      - name: Make self-audit artifacts readable by the runner
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/antislopscan-reports" ]; then
            sudo chmod -R a+rX "$RUNNER_TEMP/antislopscan-reports"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: antislopscan-self-audit
          path: ${{ runner.temp }}/antislopscan-reports/
      - uses: actions/upload-artifact@v4
        with:
          name: antislopscan-npm
          path: ${{ runner.temp }}/antislopscan-npm/*.tgz
